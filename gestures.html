<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Gestures Practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <style>
    
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  padding: 20px;
  text-align: center;
}

.gesture-area {
  width: 100%;
  height: 350px;
  background: #eee;
  border-radius: 15px;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.gesture-box {
  width: 130px;
  height: 130px;
  background: royalblue;
  color: white;
  border-radius: 15px;
  display: grid;
  place-items: center;
  touch-action: none;
  user-select: none;
}

.gesture-box {
  position: relative;
  touch-action: none;
  cursor: grab;
}

#output {
  margin-top: 20px;
  font-weight: bold;
}

  </style>
</head>

<body>
  
  <h2>Mobile Gesture Playground</h2>
  
  <div class="gesture-area">
    <div class="gesture-box">
      Touch Me
    </div>
  </div>
  
  <p id="output">Waiting for interaction...</p>
  
</body>

</html>
