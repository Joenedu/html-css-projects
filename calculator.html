<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="./calculator.css"/>
</head>
<body>
  <main class="calculator">
    <div class="display">
      0
    </div>
    <div class="keypad">
      <button class="operator key">AC</button>
      <button class="operator key"><<</button></button>
      <button class="operator key">%</button>
      <button class="operator key">÷</button>
      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button class="operator key">x</button>
      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button class="operator key">-</button>
      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button class="operator key">+</button>
      <button class="key zero">0</button>
      <button class="key">.</button>
      <button class="operator equal key">=</button>
    </div>
  </main>
</body>

</html>
