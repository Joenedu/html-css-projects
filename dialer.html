<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Dial Pad</title>
  <link rel="stylesheet" href="dialer.css">
</head>
<body>

  <main class="dialer">

    <div class="dial-pad">

      <button class="key"><span>1</span><small>∞</small></button>
      <button class="key"><span>2</span><small>ABC</small></button>
      <button class="key"><span>3</span><small>DEF</small></button>

      <button class="key"><span>4</span><small>GHI</small></button>
      <button class="key"><span>5</span><small>JKL</small></button>
      <button class="key"><span>6</span><small>MNO</small></button>

      <button class="key"><span>7</span><small>PQRS</small></button>
      <button class="key"><span>8</span><small>TUV</small></button>
      <button class="key"><span>9</span><small>WXYZ</small></button>

      <button class="key"><span>*</span></button>
      <button class="key"><span>0</span><small>+</small></button>
      <button class="key"><span>#</span></button>
    
    </div>
 
       <button class="call-button">
      ☎ <span>Call</span>
    </button>

  </main>

</body>
</html>
