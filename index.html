<!DOCTYPE html>
<html>

<head>

  <link rel="stylesheet" href="./index.css">

<body>
  <div class="app-container">
    <h1>UI Demos </h1>
    <p id="docState"></p>
    <a href="./dialer.html">Dialer UI</a>
    <a href="./calculator.html">Calculator UI</a>
    <a href="./phone-cleaner.html">Phone Cleaner UI</a>

  <script>
  
  document.querySelector('#docState').textContent = document.readyState
  
  console.log(document.readyState)
  
  document.addEventListener('DOMContentLoaded', ()=>{
    
      document.querySelector('#docState').textContent = `DOM State: ${document.readyState}`
      console.log(document.readyState)
    
    setTimeout(()=>{
      document.querySelector('#docState').textContent = `DOM State: ${document.readyState}`
      console.log(document.readyState)
    }, 800)
    
  })
  </script>
</body>
